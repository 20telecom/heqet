# Heqet FreePBX 17 Installer - menu-driven (no auto-boot)


DEFAULT heqet
TIMEOUT 0         # 0 = wait indefinitely for user selection
PROMPT 1          # show boot prompt/menu

MENU TITLE Heqet · FreePBX 17 Installer
MENU BACKGROUND /isolinux/splash.png
MENU TABMSG Press Enter to launch · HEQET gate will confirm
MENU COLOR screen 37;40      #80000000 #00000000 std
MENU COLOR border 30;44      #00000000 #00000000 std
MENU COLOR title 1;36;44     #f0f0f0f0 #40000000 std
MENU COLOR sel 7;37;40       #e0000000 #20ff8000 all
MENU COLOR unsel 37;40       #e0f0f0f0 #20000000 std
MENU COLOR help 37;40        #c0f0f0f0 #20000000 std
MENU COLOR timeout_msg 37;40 #80f0f0f0 #00000000 std
MENU COLOR timeout 1;37;40   #c0f0f0f0 #00000000 std
MENU COLOR msg07 37;40       #90f0f0f0 #00000000 std

LABEL heqet
	MENU LABEL Heqet Automated Installation
	MENU DEFAULT
	KERNEL /install.amd/vmlinuz
	APPEND initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/preseed.cfg file=/cdrom/preseed.cfg console=tty1 DEBIAN_FRONTEND=text debian-installer/framebuffer=false
