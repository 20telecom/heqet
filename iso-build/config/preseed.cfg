d-i preseed/early_command string \
    chmod +x /cdrom/heqet-gate.sh; \
    /bin/sh /cdrom/heqet-gate.sh || reboot; \
    # --- USB safe disk detection --- \
    # Find which device we booted from so we don't install onto the USB stick. \
    # Writes the chosen target disk to /tmp/heqet-target-disk for partman. \
    BOOT_DEV=""; \
    if [ -f /proc/cmdline ]; then \
        for param in $(cat /proc/cmdline); do \
            case "$param" in \
                root=*) BOOT_DEV="${param#root=}" ;; \
            esac; \
        done; \
    fi; \
    if [ -z "$BOOT_DEV" ] || [ ! -b "$BOOT_DEV" ]; then \
        BOOT_DEV=$(mount | grep ' /cdrom ' | awk '{print $1}' | sed 's/[0-9]*$//'); \
    fi; \
    BOOT_DISK=$(echo "$BOOT_DEV" | sed 's/[0-9]*$//'); \
    TARGET=""; \
    for CANDIDATE in /dev/sda /dev/sdb /dev/vda /dev/nvme0n1 /dev/mmcblk0; do \
        if [ -b "$CANDIDATE" ] && [ "$CANDIDATE" != "$BOOT_DISK" ]; then \
            TARGET="$CANDIDATE"; \
            break; \
        fi; \
    done; \
    if [ -z "$TARGET" ]; then \
        TARGET="/dev/sda"; \
    fi; \
    printf "%s" "$TARGET" > /tmp/heqet-target-disk; \
    dd if=/dev/zero of="$TARGET" bs=512 count=2048 || true

#### Preseed Configuration for Automated Debian 12 Installation
#### This file enables fully unattended installation of Debian 12 (Bookworm)
#### with IN1CLICK integration for FreePBX 17

### Localization
d-i debconf/priority string critical
d-i auto-install/enable boolean true
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i console-setup/charmap47 select UTF-8
d-i console-setup/fontface47 select Fixed
d-i console-setup/fontsize-text47 select 16

### Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string freepbx.sangoma.local
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

### Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$0/6dsZH4Q/j2LRDU$kJQMREN0kQJYYYg75j/MhiJoX5BrsifgbwUIl.kLsfoQ93K3vInnsB0z7SgVbb66XIvzZnU.jF7v0lk8VP2VF0
d-i passwd/make-user boolean false

### Clock and time zone setup
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda /dev/vda /dev/nvme0n1 /dev/mmcblk0

d-i partman/early_command string \
    if [ -f /tmp/heqet-target-disk ]; then \
        TARGET=$(cat /tmp/heqet-target-disk); \
        debconf-set partman-auto/disk "$TARGET" || true; \
    fi

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system installation
d-i base-installer/kernel/image string linux-image-amd64

### Apt setup
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl wget gnupg2 ca-certificates lsb-release apt-transport-https software-properties-common build-essential git sudo iptables net-tools dnsutils plymouth plymouth-themes cloud-init
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Reboot into installed system and eject media to avoid installer loops
d-i debian-installer/exit/reboot boolean true
d-i cdrom-detect/eject boolean false

# Set root password and locale from gate selections, then deploy IN1CLICK
d-i preseed/late_command string \
    echo '#!/bin/sh' > /target/tmp/set-pw.sh; \
    echo 'PW=$(cat /tmp/heqet-pw)' >> /target/tmp/set-pw.sh; \
    echo 'HASH=$(openssl passwd -6 "$PW")' >> /target/tmp/set-pw.sh; \
    echo 'echo "root:$HASH" | chpasswd -e' >> /target/tmp/set-pw.sh; \
    echo 'unset PW HASH' >> /target/tmp/set-pw.sh; \
    chmod +x /target/tmp/set-pw.sh; \
    cp /tmp/heqet-pw /target/tmp/heqet-pw; \
    in-target /tmp/set-pw.sh; \
    rm -f /target/tmp/set-pw.sh /target/tmp/heqet-pw /tmp/heqet-pw; \
    cp /tmp/heqet-locale /target/tmp/heqet-locale 2>/dev/null || true; \
    cp /tmp/heqet-keymap /target/tmp/heqet-keymap 2>/dev/null || true; \
    echo '#!/bin/sh' > /target/tmp/set-locale.sh; \
    echo 'if [ -f /tmp/heqet-locale ]; then echo "LANG=$(cat /tmp/heqet-locale)" > /etc/default/locale; update-locale LANG=$(cat /tmp/heqet-locale); fi' >> /target/tmp/set-locale.sh; \
    echo 'if [ -f /tmp/heqet-keymap ]; then sed -i "s/^XKBLAYOUT=.*/XKBLAYOUT=\"$(cat /tmp/heqet-keymap)\"/" /etc/default/keyboard; dpkg-reconfigure -f noninteractive keyboard-configuration; fi' >> /target/tmp/set-locale.sh; \
    chmod +x /target/tmp/set-locale.sh; \
    in-target /tmp/set-locale.sh; \
    rm -f /target/tmp/set-locale.sh /target/tmp/heqet-locale /target/tmp/heqet-keymap; \
    in-target mkdir -p /opt/in1click; \
    in-target mkdir -p /var/log/in1click; \
    cp /cdrom/in1click/diagnostics.sh /target/opt/in1click/diagnostics.sh 2>/dev/null || true; \
    cp /cdrom/in1click/IN1CLICK /target/opt/in1click/IN1CLICK 2>/dev/null || true; \
    in-target chmod +x /opt/in1click/diagnostics.sh 2>/dev/null || true; \
    in-target chmod +x /opt/in1click/IN1CLICK 2>/dev/null || true; \
    in-target chown root:root /opt/in1click/IN1CLICK 2>/dev/null || true; \
    in-target systemctl mask getty@tty1.service; \
    echo '[Unit]' > /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'Description=IN1CLICK FreePBX Installation (First Boot)' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'After=network-online.target local-fs.target plymouth-quit.service' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'Wants=network-online.target' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'ConditionPathExists=/opt/in1click/IN1CLICK' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo '' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo '[Service]' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'Type=oneshot' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'ExecStart=/opt/in1click/IN1CLICK' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'StandardOutput=tty' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'StandardError=tty' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'TTYPath=/dev/tty1' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'RemainAfterExit=yes' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo '' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo '[Install]' >> /target/etc/systemd/system/in1click-firstboot.service; \
    echo 'WantedBy=multi-user.target' >> /target/etc/systemd/system/in1click-firstboot.service; \
    in-target systemctl enable in1click-firstboot.service; \
    in-target mkdir -p /etc/systemd/system/apache2.service.d; \
    echo '[Unit]' > /target/etc/systemd/system/apache2.service.d/after-network.conf; \
    echo 'After=network-online.target' >> /target/etc/systemd/system/apache2.service.d/after-network.conf; \
    echo '[Unit]' > /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'Description=Disable IN1CLICK and always re-enable getty@tty1 after run' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'After=in1click-firstboot.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'Requires=in1click-firstboot.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ConditionPathExists=/opt/in1click/IN1CLICK' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo '' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo '[Service]' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'Type=oneshot' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStart=/bin/systemctl disable in1click-firstboot.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStart=/bin/systemctl disable in1click-cleanup.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStartPost=/bin/systemctl unmask getty@tty1.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStartPost=/bin/systemctl enable getty@tty1.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStartPost=/bin/systemctl restart getty@tty1.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'ExecStartPost=/bin/rm -f /etc/systemd/system/in1click-firstboot.service /etc/systemd/system/in1click-cleanup.service' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo '' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo '[Install]' >> /target/etc/systemd/system/in1click-cleanup.service; \
    echo 'WantedBy=multi-user.target' >> /target/etc/systemd/system/in1click-cleanup.service; \
    in-target systemctl enable in1click-cleanup.service;
